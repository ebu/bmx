name: Build for all OS
on:
  pull_request:
  push:
jobs:
  build_and_test:
    if: ${{ true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-20
            os: ubuntu-20.04
            cmake_config_args: >-
              -DCMAKE_BUILD_TYPE=Release
              -DBUILD_SHARED_LIBS=OFF \
              -DBMX_BUILD_TESTING=OFF \
              -DBMX_BUILD_TOOLS=OFF \
              -DBMX_BUILD_WITH_LIBCURL=ON
          - name: ubuntu-latest
            os: ubuntu-latest
            cmake_config_args: >-
              -DCMAKE_BUILD_TYPE=Release
              -DBUILD_SHARED_LIBS=OFF \
              -DBMX_BUILD_TESTING=OFF \
              -DBMX_BUILD_TOOLS=OFF \
              -DBMX_BUILD_WITH_LIBCURL=ON
          - name: macos
            os: macos-latest
            cmake_config_args: >-
              -DCMAKE_BUILD_TYPE=Release
              -DBUILD_SHARED_LIBS=OFF \
              -DBMX_BUILD_TESTING=OFF \
              -DBMX_BUILD_TOOLS=OFF \
              -DBMX_BUILD_WITH_LIBCURL=ON
          - name: windows
            os: windows-latest
            cmake_build_args: >-
              --config Release
            cmake_test_args: >-
              -C Release

    runs-on: ${{ matrix.os }}

    steps:
      - name: Install dependencies (Ubuntu)
        if: ${{ contains(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          sudo apt-get -y update
          sudo apt-get -y install \
            ${{ matrix.apt_installs }} \
            git \
            pkg-config \
            g++ \
            gcc \
            cmake \
            uuid-dev \
            liburiparser-dev \
            libexpat1-dev \
            libcurl4-openssl-dev
      - name: Install dependencies (MacOS)
        if: ${{ contains(matrix.os, 'macos') }}
        shell: bash
        run: |
          brew install git cmake expat uriparser curl

      - name: Show Versions
        shell: bash
        run: |
          git --version
          cmake --version

      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.TOKEN_FOR_DEPS }}
          submodules: true

      - name: Configure
        shell: bash
        run: |
          mkdir -p build
          cmake \
            -B build \
            ${{ matrix.cmake_config_args }} \
            -DCMAKE_INSTALL_PREFIX:PATH=out/install \
            -DLIBMXF_BUILD_EXAMPLES=OFF \
            -DLIBMXF_BUILD_TOOLS=OFF \
            -DLIBMXFPP_BUILD_EXAMPLES=OFF \
            -DLIBMXFPP_BUILD_TOOLS=OFF \
            .

      - name: Build
        shell: bash
        run: |
          cmake --build build ${{ matrix.cmake_build_args }}


      - name: Zip artifact (Ubuntu, Mac)
        if: ${{ !contains(matrix.os, 'windows') }}
        shell: bash
        run: |
          tar -czvf build.tar.gz build/apps/mxf2raw/mxf2raw build/apps/raw2bmx/raw2bmx

      - name: Zip artifact (Win)
        if: ${{ contains(matrix.os, 'windows') }}
        shell: bash
        run: |
          tar -czvf build.tar.gz apps/mxf2raw/Release/mxf2raw.exe apps/raw2bmx/Release/raw2bmx.exe



